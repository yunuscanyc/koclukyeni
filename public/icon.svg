<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pwaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Canvas with Safe Margins -->
  <rect width="512" height="512" rx="112" fill="url(#pwaGrad)" />
  
  <!-- Subtle Background Rings / Target Grid -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" />
  
  <!-- Main Graduation Cap & Focus Icon Center -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond -->
    <path d="M256 140 L390 205 L256 270 L122 205 Z" fill="#ffffff" />
    
    <!-- Cap Neck / Base -->
    <path d="M165 228 V295 C165 330 347 330 347 295 V228 L256 270 Z" fill="#e0e7ff" />
    
    <!-- Tassel String & Bead -->
    <path d="M370 205 C370 205 385 240 385 290" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="385" cy="296" r="10" fill="url(#goldGrad)" />
    
    <!-- Star / Achievement Badge in Center -->
    <path d="M256 345 L263 365 L284 365 L267 378 L273 398 L256 385 L239 398 L245 378 L228 365 L249 365 Z" fill="url(#goldGrad)" />
  </g>
</svg>
